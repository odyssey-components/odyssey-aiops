# Local deployment example. Replace the static root with your release directory.
# Public ingress/authentication is outside this local service's trust boundary.
server {
    listen 127.0.0.1:8080;
    server_name localhost 127.0.0.1;
    root /opt/aiops/web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4176;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
