apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiops
  namespace: aiops
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /aiops
            pathType: Prefix
            backend:
              service:
                name: aiops
                port:
                  name: http
