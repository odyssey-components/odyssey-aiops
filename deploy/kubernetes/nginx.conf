log_format aiops_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
map $http_host $aiops_allowed_host {
    default 0;
    "${AIOPS_PUBLIC_HOST}" 1;
    "${AIOPS_EXTERNAL_HOST}" 1;
}
map $request_method $aiops_expected_origin {
    default $http_origin;
    POST https://$http_host;
}
server {
    listen 8080;
    access_log /dev/stdout aiops_access;
    server_name ${AIOPS_PUBLIC_HOST};
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /healthz { return 204; }
    location = /aiops { return 308 /aiops/; }
    location /aiops/api/ {
        if ($aiops_allowed_host = 0) { return 403; }
        if ($http_origin != $aiops_expected_origin) { return 403; }
        proxy_pass http://127.0.0.1:4176/api/;
        proxy_set_header Host 127.0.0.1:4176;
        proxy_set_header Origin http://127.0.0.1:4176;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location /aiops/ {
        try_files $uri $uri/ /aiops/index.html;
    }
}
